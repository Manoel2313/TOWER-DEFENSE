<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>TOWER DEFENSE 1970 v23</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
  html, body {
    height: 100%; background: #000; color: #33ff33;
    font-family: 'VT323', 'Courier New', monospace;
    overflow: hidden; user-select: none; touch-action: manipulation;
  }
  body { display: flex; justify-content: center; align-items: center; }
  body::before {
    content: ""; position: fixed; inset: 0;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.28) 3px, rgba(0,0,0,0.28) 4px);
    pointer-events: none; z-index: 9999; animation: flicker 0.15s infinite;
  }
  body::after {
    content: ""; position: fixed; inset: 0;
    background: radial-gradient(circle at center, rgba(51,255,51,0.07), rgba(0,0,0,0.65) 100%);
    pointer-events: none; z-index: 9998;
  }
  @keyframes flicker { 0% { opacity: 0.94; } 50% { opacity: 1; } 100% { opacity: 0.96; } }

  .screen { position: fixed; inset: 0; background: #000; display: none; flex-direction: column;

  .screen.active { display: flex; }
  #menu { justify-content: center; align-items: center; gap: 20px; padding: 20px; }
  #menu h1 { font-size: 52px; color: #33ff33; text-shadow: 0 0 20px #33ff33, 0 0 40px #33ff33;
    letter-spacing: 6px; text-align: center; animation: titlePulse 2s ease-in-out infinite; }
  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 20px #33ff33, 0 0 40px #33ff33; }
    50% { text-shadow: 0 0 30px #33ff33, 0 0 60px #33ff33, 0 0 90px #33ff33; }
  }
  #menu .subtitle { color: #22aa22; font-size: 22px; letter-spacing: 6px; margin-top: -20px; }
  #crystalDisplay { color: #66ddff; font-size: 26px; letter-spacing: 3px; text-shadow: 0 0 10px #66ddff;
    border: 2px solid #66ddff; padding: 8px 20px; background: #000;
    box-shadow: 0 0 15px #66ddff; }
  .menu-options { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .mode-btn { background: #000; border: 3px solid #33ff33; color: #33ff33;
    padding: 20px 30px; font-family: 'VT323', monospace; cursor: pointer;
    text-align: center; min-width: 180px; transition: all 0.15s;
    box-shadow: 0 0 20px #33ff33, inset 0 0 15px rgba(51,255,51,0.2); user-select: none; }
  .mode-btn:active, .mode-btn:hover { background: #33ff33; color: #000;
    box-shadow: 0 0 40px #33ff33, transform: scale(1.05); }
  .mode-btn:hover .mode-icon, .mode-btn:hover .mode-name, .mode-btn:hover .mode-desc {
    color: #000; text-shadow: none; }
  .mode-icon { font-size: 50px; margin-bottom: 8px; line-height: 1; }
  .mode-name { font-size: 28px; letter-spacing: 5px; margin-bottom: 6px; }
  .mode-desc { font-size: 14px; letter-spacing: 2px; color: #22aa22; }

  .screen h2 { font-size: 32px; color: #33ff33; text-shadow: 0 0 15px #33ff33;
    letter-spacing: 5px; text-align: center; margin-bottom: 8px; }
  .info-line { text-align: center; color: #22aa22; font-size: 18px; letter-spacing: 2px; margin-bottom: 12px; }
  .info-line strong { color: #ffd700; }
  .info-line.full strong { color: #33ff33; }

  #deckGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));

  .deck-card { background: #000; border: 2px solid #33ff33; color: #33ff33;

  .action-btn.cyan { border-color: #66ddff; color: #66ddff; }

  .upgrade-card .u-btn:disabled { opacity: 0.35; cursor: not-allowed; border-color: #555; color: #555; }
  .upgrade-card .u-btn.max { border-color: #ffd700; color: #ffd700; background: #1a1a00; cursor: default; }

  #mapSelectGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px; max-width: 900px; margin: 0 auto; width: 100%; }
  .map-card { background: #000; border: 2px solid #33ff33; color: #33ff33;

  .map-card .map-name { font-size: 18px; font-weight: bold; margin-bottom: 2px; }
  .map-card.selected .map-name { color: #ffd700; }
  .map-card .map-desc { font-size: 12px; color: #22aa22; }

  .custom-map-box { max-width: 900px; margin: 12px auto 0 auto;
    border: 2px solid #66ddff; padding: 12px; background: #000; }
  .custom-map-box .box-title { color: #66ddff; font-size: 20px;
    letter-spacing: 3px; margin-bottom: 8px; }
  .custom-map-box textarea { width: 100%; min-height: 60px;

    font-family: 'VT323', monospace; font-size: 14px; padding: 8px; resize: vertical; }
  .custom-map-box .box-actions { display: flex; gap: 10px; margin-top: 8px; }

  /* BOTÃO LAMBDA (zona adm) */

  #secretModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9);

  #customMapModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9);

  #editorScreen { position: fixed; inset: 0; background: #000;
    display: none; flex-direction: column; z-index: 20000;

  #editorScreen.active { display: flex; }
